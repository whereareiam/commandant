[versions]

# general
lombok = "1.18.42"
jetbrains-annotations = "26.0.2"
# Keystone 2 with its NeoForge platform (whereareiam/keystone#18 and feature/platform-neoforge), built into mavenLocal
keystone = "2.0.0-local-48c3b7b"
# Semantica with joined and linked values (feature/composed-values over feature/typed-values), built into mavenLocal
semantica = "dev-composed"
configura = "2.1.0"

# cloud
cloud = "2.0.0"
cloud-cooldown = "1.0.0-rc.1"

# the Adventure Commandant's tests render Keystone's texts with
adventure = "5.2.0"

# testing
junit = "6.0.0"
mockito = "5.20.0"

[libraries]

# general
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
jetbrains-annotations = { group = "org.jetbrains", name = "annotations", version.ref = "jetbrains-annotations" }
keystone-api = { group = "me.whereareiam", name = "keystone-api", version.ref = "keystone" }
keystone-common = { group = "me.whereareiam", name = "keystone-common", version.ref = "keystone" }
keystone-platform-common = { group = "me.whereareiam", name = "keystone-platform-common", version.ref = "keystone" }

# semantica
semantica-processor = { group = "me.whereareiam.semantica", name = "semantica-processor", version.ref = "semantica" }
semantica-source-file = { group = "me.whereareiam.semantica", name = "source-file", version.ref = "semantica" }
semantica-syntax-icu = { group = "me.whereareiam.semantica", name = "syntax-icu", version.ref = "semantica" }
semantica-testing = { group = "me.whereareiam.semantica", name = "semantica-testing", version.ref = "semantica" }
semantica-format-adventure-v5 = { group = "me.whereareiam.semantica", name = "format-adventure-v5", version.ref = "semantica" }
configura = { group = "me.whereareiam", name = "configura", version.ref = "configura" }

# cloud
cloud-core = { group = "org.incendo", name = "cloud-core", version.ref = "cloud" }
cloud-cooldowns = { group = "org.incendo", name = "cloud-processors-cooldown", version.ref = "cloud-cooldown" }
cloud-annotations = { group = "org.incendo", name = "cloud-annotations", version.ref = "cloud" }

# adventure
adventure-api = { group = "net.kyori", name = "adventure-api", version.ref = "adventure" }
adventure-minimessage = { group = "net.kyori", name = "adventure-text-minimessage", version.ref = "adventure" }
adventure-plain = { group = "net.kyori", name = "adventure-text-serializer-plain", version.ref = "adventure" }

# testing
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform = { group = "org.junit.platform", name = "junit-platform-launcher" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-junit = { group = "org.mockito", name = "mockito-junit-jupiter", version.ref = "mockito" }

[plugins]
semantica = { id = "me.whereareiam.semantica", version.ref = "semantica" }
